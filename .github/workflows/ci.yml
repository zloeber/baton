name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Set up Python for Hermes bridge tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install pytest || pip install pytest
      - name: Run Hermes bridge contract + parity tests
        run: |
          python -m pip install --quiet pytest
          pytest tests/python
